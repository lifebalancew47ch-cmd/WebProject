name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # SAST: análisis estático del código (ESLint + eslint-plugin-security)
  lint:
    name: Lint & SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  # SCA: escaneo de dependencias con vulnerabilidades conocidas
  dependency-audit:
    name: Dependency Audit (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      # Actualizado 2026-08-10: el upgrade a Next 16 (ver docs/SECURITY.md)
      # eliminó las vulnerabilidades altas de `next`, y la migración de
      # eslint-config-next a la v16 (que exige ESLint 9 + flat config,
      # ver eslint.config.mjs) eliminó las últimas 5 que quedaban en
      # dependencias de lint. `npm audit --audit-level=high` está limpio
      # (0 vulnerabilidades) — ya no hace falta `continue-on-error`, así
      # que ahora sí bloquea el pipeline ante vulnerabilidades altas/críticas
      # nuevas.
      - name: npm audit (nivel alto o superior)
        run: npm audit --audit-level=high
      # Escaneo opcional con Snyk — se activa solo si el repo tiene
      # configurado el secret SNYK_TOKEN (Settings → Secrets → Actions).
      # Sin ese secret, este paso se omite sin fallar el pipeline.
      - name: Snyk (opcional, requiere SNYK_TOKEN)
        if: ${{ secrets.SNYK_TOKEN != '' }}
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # Verifica que el sitio estático realmente compile antes de mergear.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build
