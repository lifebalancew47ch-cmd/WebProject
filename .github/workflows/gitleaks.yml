name: Gitleaks

# Escaneo de secretos (API keys, tokens, credenciales) en cada push/PR a
# main. Se instala el binario de Gitleaks directo desde sus releases de
# GitHub en vez de usar la Action empaquetada (gitleaks/gitleaks-action),
# que requiere una licencia de pago fuera de repos públicos — el binario en
# sí es open source (MIT) y gratuito sin condiciones.
#
# Motivación directa: esta misma sesión encontró un PAT de GitHub expuesto
# en texto plano en `.git/config` (ver docs/SECURITY.md, punto de PAT
# filtrado) — este workflow es la manera de que eso no vuelva a pasar sin
# que alguien lo note.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historial completo — Gitleaks escanea commits pasados, no solo el HEAD

      - name: Instalar Gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      - name: Escanear repositorio
        run: ./gitleaks detect --source . --verbose --redact --exit-code 1
